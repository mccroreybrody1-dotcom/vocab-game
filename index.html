<!DOCTYPE html>
<html>
<head>
  <title>Retro Bowl Style Field Goal Game</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #e8f3ff;
    }

    #game-box {
      background: white;
      padding: 20px;
      margin: 40px auto;
      width: 700px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
    }

    #score {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* FIELD */
    #kick-area {
      position: relative;
      width: 600px;
      height: 300px;
      margin: 20px auto;
      background: linear-gradient(#3b8b3b, #2f6e2f);
      border: 2px solid #333;
      overflow: hidden;
    }

    /* GOALPOST */
    #goalpost {
      position: absolute;
      bottom: 60px;
      left: 260px;
      width: 80px;
      height: 140px;
      border-left: 8px solid yellow;
      border-right: 8px solid yellow;
      border-top: 8px solid yellow;
    }

    /* FOOTBALL */
    #football {
      position: absolute;
      bottom: 10px;
      left: 20px;
      width: 35px;
      height: 20px;
      background: brown;
      border-radius: 50%;
      display: none;
      border: 2px solid #552200;
    }

    /* TIMING BAR */
    #timingBarContainer {
      width: 300px;
      height: 20px;
      background: #ddd;
      margin: auto;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #444;
      display: none;
    }

    #timingBar {
      width: 60px;
      height: 20px;
      background: red;
      position: relative;
      left: 0;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="game-box">
  <h1>🏈 Retro Bowl Style Field Goal Game</h1>
  <div id="score">Score: 0</div>

  <div id="question-box">
    <h2 id="question"></h2>
  </div>

  <div id="answers"></div>

  <p id="message"></p>

  <div id="timingBarContainer">
    <div id="timingBar"></div>
  </div>

  <button id="kickButton" style="display:none;" onclick="stopBar()">STOP BAR</button>

  <div id="kick-area">
    <div id="goalpost"></div>
    <div id="football"></div>
  </div>
</div>

<script>
  const questions = [
    { q: "Energy due to motion is called:", a: ["Potential Energy", "Kinetic Energy", "Thermal Energy"], correct: 1 },
    { q: "A moving car, bouncing ball, or running child are examples of:", a: ["Kinetic Energy", "Temperature", "Pressure"], correct: 0 },
    { q: "The measure of the average kinetic energy of particles is:", a: ["Heat", "Temperature", "Thermal Expansion"], correct: 1 },
    { q: "Stored energy due to interactions between objects or particles is:", a: ["Potential Energy", "Thermal Energy", "Chemical Formula"], correct: 0 },
    { q: "Hot water steaming and heated metal glowing red-hot are examples of:", a: ["Thermal Energy", "Kinetic Energy", "Atoms"], correct: 0 },
    { q: "A small particle that is the building block of matter is an:", a: ["Element", "Atom", "Molecule"], correct: 1 },
    { q: "Matter with a composition that is always the same is a:", a: ["Compound", "Substance", "Element"], correct: 1 },
    { q: "A substance that consists of only one type of atom is an:", a: ["Element", "Compound", "Molecule"], correct: 0 },
    { q: "A substance containing atoms of two or more elements chemically bonded is a:", a: ["Element", "Compound", "Atom"], correct: 1 },
    { q: "H₂O, CO₂, and NaCl are examples of:", a: ["Chemical Formulas", "Elements", "Pressure"], correct: 0 },
    { q: "A decrease in a material's volume when temperature decreases is:", a: ["Thermal Expansion", "Thermal Contraction", "Heat"], correct: 1 },
    { q: "An increase in a material's volume when temperature increases is:", a: ["Thermal Expansion", "Pressure", "Vaporization"], correct: 0 },
    { q: "The transfer of thermal energy from warmer to cooler areas is:", a: ["Heat", "Temperature", "Kinetic Energy"], correct: 0 },
    { q: "Two or more atoms held together by covalent bonds form a:", a: ["Atom", "Element", "Molecule"], correct: 2 }
  ];

  let current = 0;
  let score = 0;

  let barInterval;
  let barPos = 0;
  let barDirection = 1;

  function updateScore() {
    document.getElementById("score").innerText = "Score: " + score;
  }

  function loadQuestion() {
    const q = questions[current];
    document.getElementById("question").innerText = q.q;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.a.forEach((ans, index) => {
      const btn = document.createElement("button");
      btn.innerText = ans;
      btn.onclick = () => checkAnswer(index);
      answersDiv.appendChild(btn);
    });
  }

  function checkAnswer(index) {
    const q = questions[current];
    if (index === q.correct) {
      score += 5;
      updateScore();
      document.getElementById("message").innerText = "Correct! Time your kick!";
    } else {
      document.getElementById("message").innerText = "Incorrect! You still get to kick!";
    }

    startTimingBar();
  }

  function startTimingBar() {
    document.getElementById("timingBarContainer").style.display = "block";
    document.getElementById("kickButton").style.display = "inline-block";

    barPos = 0;
    barDirection = 1;

    barInterval = setInterval(() => {
      barPos += barDirection * 5;

      if (barPos >= 240) barDirection = -1;
      if (barPos <= 0) barDirection = 1;

      document.getElementById("timingBar").style.left = barPos + "px";
    }, 20);
  }

  function stopBar() {
    clearInterval(barInterval);

    let accuracy = Math.abs(barPos - 120); // center is best

    let curve = accuracy / 40; // bigger = more curve

    kickFootball(curve);
  }

  function kickFootball(curve) {
    const football = document.getElementById("football");
    football.style.display = "block";

    let x = 20;
    let y = 10;

    let vx = 5;
    let vy = 5;

    const interval = setInterval(() => {
      x += vx;
      y += vy;
      vy -= 0.2;

      // curve the ball based on timing
      x += curve;

      football.style.left = x + "px";
      football.style.bottom = y + "px";

      if (x > 260 && x < 340 && y > 140) {
        clearInterval(interval);
        document.getElementById("message").innerText = "🏈 Field Goal GOOD!";
        score += 3;
        updateScore();
        resetKick();
      }

      if (y < 0 || x > 600) {
        clearInterval(interval);
        document.getElementById("message").innerText = "❌ Missed!";
        resetKick();
      }
    }, 30);
  }

  function resetKick() {
    document.getElementById("football").style.display = "none";
    document.getElementById("timingBarContainer").style.display = "none";
    document.getElementById("kickButton").style.display = "none";

    nextQuestion();
  }

  function nextQuestion() {
    current++;
    if (current >= questions.length) {
      document.getElementById("question-box").innerHTML =
        "<h2>Game Over!</h2><h3>Your Final Score: " + score + "</h3>";
      document.getElementById("answers").innerHTML = "";
      return;
    }
    loadQuestion();
  }

  loadQuestion();
  updateScore();
</script>

</body>
</html>
